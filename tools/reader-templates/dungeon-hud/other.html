<article class="dh-page dh-marching">

  <div class="dh-motes" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="dh-sky"></div>
    <div class="dh-props"><i class="dh-prop-b"></i><i class="dh-prop-c"></i><i class="dh-prop-d"></i></div>
    <div class="dh-foe dh-foe-spider"><i class="dh-f"></i></div>

    <div class="dh-dialog" aria-hidden="true"><i></i><span>「你比上一次更安静了。」</span></div>
