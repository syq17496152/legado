<article class="dh-page dh-marching" data-dh-region="town" data-dh-perf="battle">
  <div class="dh-grain" aria-hidden="true"></div>
  <div class="dh-motes" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="dh-band dh-band-l" aria-hidden="true"><i class="dh-b0"></i><i class="dh-b1"></i></div>
  <div class="dh-band dh-band-r" aria-hidden="true"><i class="dh-b2"></i><i class="dh-b3"></i></div>
  <header class="dh-stage" aria-hidden="true">
    <div class="dh-sky"></div>
    <div class="dh-props"><i class="dh-prop-b"></i><i class="dh-prop-c"></i><i class="dh-prop-d"></i></div>
    <div class="dh-rig dh-hero">
      <i class="dh-p dh-p-body"></i><i class="dh-p dh-p-leg_left"></i><i class="dh-p dh-p-leg_right"></i>
      <i class="dh-p dh-p-foot_left"></i><i class="dh-p dh-p-foot_right"></i><i class="dh-p dh-p-skirt"></i>
      <i class="dh-p dh-p-chest"></i><i class="dh-p dh-p-arm_left"></i><i class="dh-p dh-p-arm_right"></i>
      <i class="dh-p dh-p-head"></i><i class="dh-p dh-p-hair"></i><i class="dh-p dh-p-shoulder_right"></i>
    </div>
    <div class="dh-foe dh-foe-boss"><i class="dh-f"></i></div>
    <div class="dh-foe dh-foe-spider"><i class="dh-f"></i></div>
    <div class="dh-foe dh-foe-slug"><i class="dh-f"></i></div>
    <div class="dh-foe dh-foe-frog"><i class="dh-f"></i></div>
    <div class="dh-npc"><i class="dh-n-f"></i></div>
    <div class="dh-fx dh-fx-slash"></div>
    <div class="dh-fx dh-fx-bolt"><i></i></div>
    <div class="dh-fx dh-fx-burst"></div>
    <div class="dh-plate"><b>ROUTE</b><span data-reader-field="bookName">幽夜回廊</span></div>
    <div class="dh-talk"><b>NPC</b><span>「别走那条干净的路。」</span></div>
    <div class="dh-requiem"><b>REQUIEM</b><em>她未归</em></div>
  </header>
  <main class="dh-paper">
    <div class="dh-frame" aria-hidden="true"></div>
    <i class="dh-corner dh-c-tl" aria-hidden="true"></i><i class="dh-corner dh-c-tr" aria-hidden="true"></i>
    <i class="dh-corner dh-c-bl" aria-hidden="true"></i><i class="dh-corner dh-c-br" aria-hidden="true"></i>
    <span class="dh-tab" aria-hidden="true">矿灯拾遗</span>
    <section class="dh-body" data-reader-flow="body" data-reader-flow-pagination="columns"></section>
  </main>
  {{footer}}
</article>
