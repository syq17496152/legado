<?xml version="1.0" encoding="UTF-8"?>
<!-- 首屏加载模板插画 · 「星轨」（项目自研手写 SVG，可重放；配色占位符由绘制期替换）
     viewBox 0 0 360 336；仅使用 rect/circle/ellipse/path/line/g/linearGradient/radialGradient -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 360 336" width="360" height="336">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="{{glow}}" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="{{glow}}" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="{{glow}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="{{horizon}}" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="{{horizon}}" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ⚠️ 不铺不透明底色（同 loading_ink 的理由：会截断外层光晕、留下矩形痕迹）；
       只保留**半透明**的深度梯度，它叠在绘制器铺好的底色之上。 -->
  <rect x="0" y="0" width="360" height="336" fill="url(#depth)"/>
  <ellipse cx="180" cy="140" rx="208" ry="150" fill="url(#core)"/>

  <!-- 环状光带（三层同心椭圆，越外越淡） -->
  <g fill="none" stroke="{{muted}}">
    <ellipse cx="180" cy="150" rx="128" ry="52" stroke-width="1.2" stroke-opacity="0.65"/>
    <ellipse cx="180" cy="150" rx="164" ry="68" stroke-width="1" stroke-opacity="0.42"/>
    <ellipse cx="180" cy="150" rx="98" ry="40" stroke-width="1.6" stroke-opacity="0.28"/>
  </g>

  <!-- 强调弧（航迹） -->
  <path d="M 52 152 C 92 106 150 92 208 108" fill="none" stroke="{{accent}}"
        stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.92"/>

  <!-- 星点（确定性坐标，非随机） -->
  <g fill="{{ink}}">
    <circle cx="70" cy="66" r="2.1" fill-opacity="0.9"/>
    <circle cx="118" cy="44" r="1.4" fill-opacity="0.6"/>
    <circle cx="266" cy="58" r="1.8" fill-opacity="0.75"/>
    <circle cx="304" cy="104" r="1.3" fill-opacity="0.55"/>
    <circle cx="46" cy="196" r="1.6" fill-opacity="0.6"/>
    <circle cx="238" cy="222" r="1.5" fill-opacity="0.5"/>
  </g>
  <g fill="{{accent}}">
    <circle cx="208" cy="108" r="3.4"/>
    <circle cx="96" cy="118" r="2.2" fill-opacity="0.8"/>
  </g>

  <!-- 底部读数线 -->
  <g stroke="{{muted}}" stroke-width="1" stroke-opacity="0.45">
    <line x1="40" y1="288" x2="320" y2="288"/>
  </g>
  <rect x="176" y="284" width="8" height="8" rx="2" fill="{{accent}}" fill-opacity="0.9"/>
</svg>
