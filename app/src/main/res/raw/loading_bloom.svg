<?xml version="1.0" encoding="UTF-8"?>
<!-- 首屏加载模板插画 · 「花笺」（项目自研手写 SVG，可重放；配色占位符由绘制期替换）
     viewBox 0 0 360 336；仅使用 rect/circle/ellipse/path/g/linearGradient/radialGradient -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 360 336" width="360" height="336">
  <defs>
    <radialGradient id="soft" cx="62%" cy="30%" r="66%">
      <stop offset="0%" stop-color="{{glow}}" stop-opacity="0.92"/>
      <stop offset="58%" stop-color="{{glow}}" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="{{glow}}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="{{horizon}}" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="{{horizon}}" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- ⚠️ 不铺不透明底色（同 loading_ink 的理由：会截断外层光晕、留下矩形痕迹）。 -->
  <ellipse cx="228" cy="104" rx="188" ry="140" fill="url(#soft)"/>

  <!-- 枝叶剪影（自左下向右上） -->
  <g fill="{{ink}}">
    <path d="M -8 300 C 46 268 74 224 96 176 C 108 150 116 122 124 96 L 132 100
             C 124 132 116 164 100 196 C 82 232 52 274 -8 312 Z" fill-opacity="0.22"/>
    <path d="M 96 176 C 132 166 158 142 176 110 C 186 92 192 76 196 60 L 204 64
             C 198 86 188 108 172 130 C 152 158 124 178 96 184 Z" fill-opacity="0.18"/>
  </g>
  <g fill="{{ink}}">
    <ellipse cx="150" cy="150" rx="26" ry="11" transform="rotate(-28 150 150)" fill-opacity="0.26"/>
    <ellipse cx="186" cy="118" rx="22" ry="9" transform="rotate(-34 186 118)" fill-opacity="0.22"/>
    <ellipse cx="122" cy="186" rx="20" ry="8" transform="rotate(-22 122 186)" fill-opacity="0.2"/>
  </g>

  <!-- 花瓣点缀 -->
  <g fill="{{accent}}">
    <ellipse cx="236" cy="86" rx="13" ry="8" transform="rotate(18 236 86)" fill-opacity="0.9"/>
    <ellipse cx="268" cy="118" rx="10" ry="6" transform="rotate(30 268 118)" fill-opacity="0.75"/>
    <ellipse cx="214" cy="132" rx="8" ry="5" transform="rotate(12 214 132)" fill-opacity="0.6"/>
  </g>

  <!-- 底部渐隐带 + 一条基线 -->
  <rect x="0" y="214" width="360" height="122" fill="url(#floor)"/>
  <g stroke="{{muted}}" stroke-width="1" stroke-opacity="0.4">
    <line x1="42" y1="268" x2="318" y2="268"/>
  </g>
</svg>
