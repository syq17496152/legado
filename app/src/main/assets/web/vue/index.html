    <script>
      // 防闪白：挂载前按系统偏好预设 data-theme（App.vue 挂载后按应用偏好覆盖）
      (function () {
        try {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>

  <body>
    <!-- 骨架屏：Vue 挂载完成后由 main.ts 隐藏 -->
    <div id="app-skeleton"><div class="skeleton-spinner"></div></div>
    <div id="app"></div>
    <!-- 启动兜底：15s 未挂载或未捕获异常时展示错误面板（供开发者定位；不引入外部 CDN 依赖） -->
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 15000;
        var state = { stage: 'html-ready', errorShown: false };

        function escapeHtml(value) {
          return String(value).replace(/[&<>"']/g, function (ch) {
            if (ch === '&') return '&amp;';
            if (ch === '<') return '&lt;';
            if (ch === '>') return '&gt;';
            if (ch === '"') return '&quot;';
            return '&#39;';
          });
        }

        function renderBootError(message) {
          if (state.errorShown) return;
          // 仅作为「挂载前」兜底：应用已挂载后的运行期异常只进 console，不遮挡界面
          if (state.stage === 'app-mounted') return;
          state.errorShown = true;
          var skeleton = document.getElementById('app-skeleton');
          if (!skeleton) return;
          skeleton.classList.remove('hidden');
          skeleton.classList.add('boot-error');
          skeleton.innerHTML =
            '<div class="skeleton-error">' +
            '<div class="skeleton-error__title">应用启动失败</div>' +
            '<div class="skeleton-error__message">' +
            escapeHtml(message) +
            '</div>' +
            '<div class="skeleton-error__hint">请按 F12 打开 DevTools 查看报错；若页面脚本未启动，请检查资源文件是否完整。</div>' +
            '</div>';
        }

        function formatReason(reason) {
          if (!reason) return '未知错误';
          if (typeof reason === 'string') return reason;
          if (reason instanceof Error) return reason.stack || reason.message || String(reason);
          try {
            return JSON.stringify(reason, null, 2);
          } catch (e) {
            return String(reason);
          }
        }

        window.__LEGADO_SET_BOOT_STAGE = function (stage) {
          state.stage = stage;
        };
        window.__LEGADO_SHOW_BOOT_ERROR = function (message) {
          renderBootError(message);
        };

        window.addEventListener('error', function (event) {
          renderBootError(
            (event.error && event.error.stack) ||
              event.message ||
              '资源加载失败: ' + (event.filename || 'unknown file'),
          );
        });
        window.addEventListener('unhandledrejection', function (event) {
          renderBootError('未处理的 Promise 异常:\n' + formatReason(event.reason));
        });
        window.setTimeout(function () {
          if (state.stage !== 'app-mounted' && !state.errorShown) {
            renderBootError(
              '前端入口在 ' + BOOT_TIMEOUT_MS / 1000 + 's 内没有完成挂载，当前阶段: ' + state.stage,
            );
          }
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
