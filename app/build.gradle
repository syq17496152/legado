plugins {
//    id "com.android.application"
//    id 'org.jetbrains.kotlin.android'
//    id 'kotlin-parcelize'
    id 'kotlin-kapt'  // Glide KSP 存在 Windows 跨盘 bug（C:\ vs F:\），暂保留 kapt
