apply from: 'download.gradle'

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "legado"
def version = "3." + releaseTime()
def gitCommits = 1
try {
    def result = 'git rev-list HEAD --count'.execute().text.trim()
    if (result) gitCommits = Integer.parseInt(result)
} catch (Exception ignored) {}

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId project.hasProperty("customAppId") ? project.property("customAppId") : "io.legado.app"
        minSdk 23
        targetSdk 36
        versionCode 10000 + gitCommits
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else if (getApplicationIdSuffix() == '.releaseS') {
                manifestPlaceholders.put("app_name", "@string/app_name_s")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavor = variant.productFlavors[0].name
            outputFileName = "${name}_${flavor}_${defaultConfig.versionName}.apk"
        }
    }


    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

// 全局排除 Compose 依赖（项目未使用 Compose，避免 activity 1.13+ / material 1.14+ 传递依赖引入整个 Compose 运行时）
configurations.all {
    exclude group: 'androidx.compose.compiler', module: 'compiler'
    exclude group: 'androidx.compose.foundation', module: 'foundation'
    exclude group: 'androidx.compose.material3', module: 'material3'
    exclude group: 'androidx.compose.material', module: 'material'
    exclude group: 'androidx.compose.material', module: 'material-icons-core'
    exclude group: 'androidx.compose.material', module: 'material-ripple'
    exclude group: 'androidx.compose.runtime', module: 'runtime'
    exclude group: 'androidx.compose.runtime', module: 'runtime-saveable'
    exclude group: 'androidx.compose.runtime', module: 'runtime-annotation'
    exclude group: 'androidx.compose.ui', module: 'ui'
    exclude group: 'androidx.compose.ui', module: 'ui-graphics'
    exclude group: 'androidx.compose.ui', module: 'ui-text'
    exclude group: 'androidx.compose.ui', module: 'ui-unit'
    exclude group: 'androidx.compose.animation', module: 'animation'
    exclude group: 'androidx.compose.animation', module: 'animation-core'
    exclude group: 'androidx.activity', module: 'activity-compose'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-runtime-compose'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-compose'
    exclude group: 'androidx.savedstate', module: 'savedstate-compose'
    exclude group: 'androidx.navigationevent', module: 'navigationevent-compose'
}

