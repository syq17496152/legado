static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "legado"
def version = "3." + releaseTime()
def gitCommits = 1
try {
    def result = 'git rev-list HEAD --count'.execute().text.trim()
    if (result) gitCommits = Integer.parseInt(result)
} catch (Exception ignored) {}

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    // 签名配置读取顺序：gradle.properties / 命令行 -P → local.properties（不入 git）
    // local.properties 用于本地开发，gradle.properties 用于 CI/CD
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localProps.load(new FileInputStream(localPropsFile))
    }
    def storeFilePath = project.findProperty("RELEASE_STORE_FILE") ?: localProps.getProperty("RELEASE_STORE_FILE")
    signingConfigs {
        if (storeFilePath != null) {
            myConfig {
                storeFile rootProject.file(storeFilePath)
                storePassword project.findProperty("RELEASE_STORE_PASSWORD") ?: localProps.getProperty("RELEASE_STORE_PASSWORD")
                keyAlias project.findProperty("RELEASE_KEY_ALIAS") ?: localProps.getProperty("RELEASE_KEY_ALIAS")
                keyPassword project.findProperty("RELEASE_KEY_PASSWORD") ?: localProps.getProperty("RELEASE_KEY_PASSWORD")
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        // 包类型判断：
        // 1. 传 -PcustomAppId=xxx → 共存包（用户自定义包名）
        // 2. 不传参数 + 构建类型 debug → 测试包（io.legado.miss.app.debug）
        // 3. 不传参数 + 构建类型 release → 正式包（io.legado.miss.app.release）
        applicationId project.hasProperty("customAppId") ? project.property("customAppId") : "io.legado.miss.app"

        // 输出包名信息，便于AI解析日志
        println "========== PACKAGE INFO =========="
        println "Base applicationId: ${applicationId}"
        println "Build type: ${project.gradle.startParameter.taskNames.find { it.contains('Release') } ? 'release' : 'debug'}"
        println "Custom package: ${project.hasProperty('customAppId')}"
        println "=================================="
        minSdk 23
        targetSdk 36
        versionCode 10000 + gitCommits
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        // ⑩ 按构建类型选择 ABI：debug 仅 arm64-v8a 精简体积（测试包常用 arm64 真机/模拟器）；
        // release 双 ABI（arm64-v8a + armeabi-v7a）保旧机型兼容。IDE 同步无显式任务时默认双 ABI（release-safe），
        // 避免误删 release 兼容性；CLI 走 `assembleAppDebug`/`assembleAppRelease` 即按目标精简。
        ndk {
            def gradleTasks = project.gradle.startParameter.taskNames*.toLowerCase()
            def releaseBuild = gradleTasks.empty || gradleTasks.any { it.contains('release') }
            if (releaseBuild) {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            } else {
                abiFilters 'arm64-v8a'
            }
        }

        // F-P1-7 打包压缩优化：仅保留项目已翻译语言，移除第三方库（Material Components/AppCompat 等）自带的其他语言资源
        // 项目实际语言资源：values(默认en)/values-zh/values-zh-rHK/values-zh-rTW/values-es-rES/values-ja-rJP/values-pt-rBR/values-vi
        // 预期减小 APK 体积约 50-100KB（移除第三方库的法语/德语/俄语等未使用语言资源）
        // 不实施 R8 full mode：会破坏 Rhino JS 引擎/Gson/Hutool 反射调用
        resConfigs 'zh', 'zh-rHK', 'zh-rTW', 'en', 'es', 'es-rES', 'ja', 'ja-rJP', 'pt', 'pt-rBR', 'vi'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    buildTypes {
        release {
            if (storeFilePath != null) {
                signingConfig signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else if (getApplicationIdSuffix() == '.releaseS') {
                manifestPlaceholders.put("app_name", "@string/app_name_s")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            // 测试包不套正式 release 签名，落回 AGP 默认 debug keystore（避免与发布签名耦合/混淆）
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavor = variant.productFlavors[0].name
            def appId = variant.applicationId
            // 从applicationId提取包名标识: io.legado.miss.app → miss, io.legado.app → legacy, 其他取最后一段
            def appIdSuffix = ""
            if (appId.startsWith("io.legado.miss.app")) {
                appIdSuffix = "miss"
            } else if (appId.startsWith("io.legado.app")) {
                appIdSuffix = "legacy"
            } else {
                // 自定义包名取最后一段
                def parts = appId.split("\\.")
                appIdSuffix = parts.length > 0 ? parts[-1] : "custom"
            }
            outputFileName = "${name}_${appIdSuffix}_${flavor}_${defaultConfig.versionName}.apk"
        }
    }


    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

