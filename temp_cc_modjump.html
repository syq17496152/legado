<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hologram{position:relative;padding:50px 60px;text-align:center}
.hologram::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,255,255,.1) 50%,transparent 50%);background-size:100% 4px;pointer-events:none;animation:scanlines 10s linear infinite}
@keyframes scanlines{to{background-position:0 100%}}
.hologram::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(0,255,255,.15) 0%,transparent 70%);pointer-events:none}
.holo-content{position:relative;z-index:2;animation:flicker 0.15s infinite}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.97}}
.holo-border{position:absolute;top:0;left:0;right:0;bottom:0;border:2px solid rgba(0,255,255,.5);clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px))}
.holo-corner{position:absolute;width:20px;height:20px;border:2px solid #0ff}
.holo-corner.tl{top:-2px;left:-2px;border-right:none;border-bottom:none}
.holo-corner.tr{top:-2px;right:-2px;border-left:none;border-bottom:none}
.holo-corner.bl{bottom:-2px;left:-2px;border-right:none;border-top:none}
.holo-corner.br{bottom:-2px;right:-2px;border-left:none;border-top:none}
.icon{font-size:60px;margin-bottom:20px;filter:drop-shadow(0 0 10px #0ff);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{font-size:28px;color:#0ff;font-weight:700;margin-bottom:8px;text-shadow:0 0 10px #0ff,0 0 20px #0ff}
.domain{font-size:12px;color:#088;margin-bottom:30px}
.data-stream{display:flex;justify-content:center;gap:5px;margin-bottom:25px;height:40px}
.data-bar{width:4px;background:linear-gradient(to top,#0ff,#088);animation:stream 1s ease-in-out infinite}
.data-bar:nth-child(1){animation-delay:0s}
.data-bar:nth-child(2){animation-delay:.1s}
.data-bar:nth-child(3){animation-delay:.2s}
.data-bar:nth-child(4){animation-delay:.3s}
.data-bar:nth-child(5){animation-delay:.4s}
.data-bar:nth-child(6){animation-delay:.5s}
.data-bar:nth-child(7){animation-delay:.6s}
@keyframes stream{0%,100%{height:10px;opacity:.3}50%{height:40px;opacity:1}}
.status{font-size:14px;color:#0ff;margin-bottom:20px;letter-spacing:2px}
.progress{width:200px;height:3px;background:#033;margin:0 auto 25px;position:relative;overflow:hidden}
.progress-bar{height:100%;background:#0ff;width:0;animation:load 3s linear forwards;box-shadow:0 0 10px #0ff}
@keyframes load{to{width:100%}}
.btn{display:none;padding:12px 40px;background:transparent;color:#0ff;border:1px solid #0ff;font-size:14px;text-decoration:none;cursor:pointer;letter-spacing:1px;transition:all .3s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{background:rgba(0,255,255,.2);box-shadow:0 0 20px rgba(0,255,255,.5)}
.note{font-size:10px;color:#066;margin-top:25px}
</style>
