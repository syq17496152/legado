# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Bugs: This will override important JVM argument defaults. Include all important JVM arguments if you wan to change arguments. See https://github.com/gradle/gradle/issues/19750
# 2026-08-21 修复：release R8/lintVital 在 Cronet bundle 大包体下 3g 堆会 OOM(GC overhead)；已完成 release 验证后改回 3g 防频繁打包堆积。后续打 release 前临时调大(refer ai_memory)
org.gradle.jvmargs=-XX:+UseParallelGC -Xmx4g -Xms256m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# 显式限制 Kotlin 编译 daemon 堆内存，避免与 Gradle daemon 各自冲向 -Xmx 打爆 32G（2026-08-21 修复）
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m
# Gradle daemon 空闲 10 分钟自动退出（默认 3h，频繁打包堆积）；daemon 退出会连带回收其拉起的 Kotlin daemon（2026-08-21 修复）
org.gradle.daemon.idletimeout=600000
org.gradle.caching=false
org.gradle.parallel=true
org.gradle.configureondemand=false
# 2026-09-03 local-build-speedup：开启 configuration cache（P2）。
# 版本号已 ValueSource 化（时间/git 提交数纳入缓存键），解决历史"enable cache can not up app version"问题
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# kotlin.incremental.useClasspathSnapshot=true
android.enableResourceOptimizations=true
# android.enableNewResourceShrinker' is deprecated.
# It was removed in version 8.0 of the Android Gradle plugin.
# android.enableNewResourceShrinker=true
android.experimental.enableNewResourceShrinker.preciseShrinking=true
# https://blog.gradle.org/introducing-file-system-watching
org.gradle.vfs.watch=true
# 2026-09-03 local-build-speedup：旧 unsafe 开关已由上方 org.gradle.configuration-cache 取代
# enable cache can not up app version（历史问题根因：配置期求值时间戳，已由 ValueSource 修复）
# Disable buildFeatures flags by default
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# enables namespacing of each library's R class so that its R class includes only the resources declared in the library itself
# and none from the library's dependencies, thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true
# https://chromiumdash.appspot.com/releases?platform=Android
# 2026-08-19: Cronet 150→500.0.1（cronet-bundled Maven 构件，替换本地 cronetlib/ jars，移除 APK 内置 so 手工打包）
CronetVersion=500.0.1
CronetMainVersion=500.0.0.0
android.injected.testOnly=false
android.nonFinalResIds=true
android.injected.androidTest.leaveApksInstalledAfterRun=true
